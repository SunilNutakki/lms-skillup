# =========================================================
# APPLICATION
# =========================================================

spring.application.name=lms-api

server.port=8081


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/lmsskillup?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always


# =========================================================
# JWT
# =========================================================

jwt.secret=LMSSkillUpSecretKeyForJwtAuthentication2026SecureKey
jwt.expiration=86400000

# =========================================================
# JPA
# =========================================================

spring.jpa.open-in-view=false