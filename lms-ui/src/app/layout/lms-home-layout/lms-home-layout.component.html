<div class="lms-home-layout">

    <!-- =========================================================
         TOPBAR
         ========================================================= -->
  
    <header class="lms-topbar">
  
      <!-- LEFT SIDE -->
  
      <div class="topbar-left">
  
        <!-- Mobile Menu -->
  
          <button
          type="button"
          class="menu-toggle"
          (click)="toggleSidebar()"
          aria-label="Toggle menu">
  
          <i class="pi pi-bars"></i>
  
        </button>
  
  
        <!-- Logo -->
  
        <a class="lms-logo">
          <span class="logo-icon">
            <i class="pi pi-graduation-cap"></i>
          </span>
        
          <span class="logo-copy">
            <span class="logo-text">LMS SkillUp</span>
            <small class="logo-subtitle">Learning Management</small>
          </span>
        
        </a>
  
  
        <!-- Global Search -->
  
        <div class="global-search">
  
          <i class="pi pi-search"></i>
  
          <input
            pInputText
            type="text"
            placeholder="Search courses, modules, content..." />
  
        </div>
  
      </div>
  
  
      <!-- RIGHT SIDE -->
  
      <div class="topbar-right">
  
        <!-- Notification -->
  
        <button
          type="button"
          class="notification-button"
          aria-label="Notifications">
  
          <i class="pi pi-bell"></i>
  
          <span class="notification-badge">
            3
          </span>
  
        </button>
  
  
        <!-- User -->
  
        <button
          type="button"
          class="user-menu">
  
          <span class="user-avatar">
            A
          </span>
  
          <span class="user-name">
            Admin
          </span>
  
          <i class="pi pi-angle-down"></i>
  
        </button>
  
      </div>
  
    </header>
  
  
    <!-- =========================================================
         BODY
         ========================================================= -->
  
    <div class="lms-body">
  
  
      <!-- =======================================================
           SIDEBAR
           ======================================================= -->
  
      <aside
        class="lms-sidebar"
        [class.sidebar-open]="sidebarOpen">
  
  
        <!-- Sidebar Navigation -->
  
        <nav class="sidebar-navigation" aria-label="Main navigation">
          <ng-container *ngFor="let item of menuItems">
            <ng-container *ngIf="item.id === 'courses'; else directMenuLink">
              <button
                type="button"
                class="menu-item menu-parent"
                [class.menu-expanded]="openMenuId === item.id"
                [attr.aria-expanded]="openMenuId === item.id"
                aria-controls="courses-submenu"
                (click)="toggleMenu(item.id!)">
                <i [class]="item.icon"></i>
                <span>{{ item.label }}</span>
                <i class="pi menu-arrow" [ngClass]="openMenuId === item.id ? 'pi-angle-up' : 'pi-angle-down'"></i>
              </button>

              <div id="courses-submenu" class="submenu" *ngIf="openMenuId === item.id">
                <a
                  *ngFor="let child of item.items"
                  [routerLink]="child.routerLink"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="submenu-item"
                  (click)="closeSidebar()">
                  <i [class]="child.icon"></i>
                  <span>{{ child.label }}</span>
                </a>
              </div>
            </ng-container>

            <ng-template #directMenuLink>
              <a
                [routerLink]="item.routerLink"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="menu-item"
                (click)="closeSidebar()">
                <i [class]="item.icon"></i>
                <span>{{ item.label }}</span>
              </a>
            </ng-template>
          </ng-container>
        </nav>
  
      </aside>
  
  
      <!-- =======================================================
           MOBILE OVERLAY
           ======================================================= -->
  
      <div
        class="sidebar-overlay"
        *ngIf="sidebarOpen"
        (click)="closeSidebar()">
      </div>
  
  
      <!-- =======================================================
           MAIN CONTENT
           ======================================================= -->
  
      <main class="lms-main-content">
  
        <router-outlet></router-outlet>
  
      </main>
  
    </div>
  
  </div>
